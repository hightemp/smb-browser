[global]
   server role = standalone server
   map to guest = Bad User
   usershare allow guests = no
   server min protocol = SMB2
   server max protocol = SMB3
   log level = 1
   follow symlinks = yes

[public]
   path = /srv/samba/public
   browsable = yes
   read only = no
   valid users = smbtest
   force user = smbtest

[archive]
   path = /srv/samba/archive
   browsable = yes
   read only = no
   valid users = smbtest
   force user = smbtest

[guest]
   path = /srv/samba/guest
   browsable = yes
   read only = no
   guest ok = yes
   force user = smbguest

[encrypted]
   path = /srv/samba/encrypted
   browsable = yes
   read only = no
   valid users = smbtest
   force user = smbtest
   smb encrypt = required

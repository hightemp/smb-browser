name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux build and unit tests
    runs-on: ubuntu-22.04

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            git \
            ninja-build \
            pkg-config \
            qtbase5-dev \
            libqt5svg5-dev \
            qttools5-dev-tools \
            qtkeychain-qt5-dev \
            libsodium-dev

      - name: Configure
        run: >
          cmake -S . -B tmp/build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DSMB_BROWSER_ENABLE_DOCKER_SAMBA_TESTS=OFF

      - name: Build
        run: cmake --build tmp/build --parallel

      - name: Test
        run: ctest --test-dir tmp/build --output-on-failure

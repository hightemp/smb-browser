name: Package Smoke

on:
  workflow_dispatch:

jobs:
  windows:
    name: Windows portable ZIP smoke
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MSYS2 UCRT64 dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libsodium
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt5-base
            mingw-w64-ucrt-x86_64-qt5-svg
            mingw-w64-ucrt-x86_64-qt5-tools

      - name: Add MSYS2 tools to PATH
        shell: pwsh
        run: |
          "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\msys64\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build QtKeychain for Qt5
        shell: msys2 {0}
        run: scripts/build-qtkeychain-qt5.sh

      - name: Build package and smoke-test
        timeout-minutes: 30
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export QTKEYCHAIN_PREFIX="$(cygpath -w "$PWD/tmp/qtkeychain-qt5-prefix")"
          export MSYSTEM_PREFIX="$(cygpath -w /ucrt64)"
          export PATH="/ucrt64/bin:/usr/bin:$PATH"
          powershell.exe -NoProfile -ExecutionPolicy Bypass \
            -File scripts/package-windows.ps1 \
            -BuildDir tmp/package-windows \
            -Generator Ninja \
            -BuildType Release \
            -SkipTests

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: smb-browser-windows-portable
          path: tmp/package-windows/packages/*.zip

  macos:
    name: macOS DMG smoke
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install cmake ninja pkg-config qt@5 libsodium

      - name: Build QtKeychain for Qt5
        run: scripts/build-qtkeychain-qt5.sh

      - name: Build package and smoke-test
        run: scripts/package-macos.sh

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: smb-browser-macos
          path: tmp/package-macos/packages/*.dmg
